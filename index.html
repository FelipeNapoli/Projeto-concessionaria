<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css">
    <title>AUTOVELLE Simulador</title>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <img src="src/assets/AUTOVELLE.png" alt="Logo AUTOVELLE">
            </div>
            <nav>
                <ul class="menu">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="index.html">Simulador</a></li>
                    <li><a href="#">Contatos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="carros-preview">
            <img src="src/assets/Carro-porsche1.webp" alt="Porsche 718">
            <img src="src/assets/porsche4.png" alt="Mercedes-AMG">
            <img src="src/assets/carro-mercedes2.avif" alt="Mercedes-Classe G">
        </section>

        <form class="form-simulador">
            <h2 class="form-titulo">Simulador</h2>

            <article class="coluna">
                <h3>Carro 1</h3>
                <div class="campo">
                    <label for="hmh1">KM/H</label>
                    <input type="number" id="kmh1" name="kmh1" step="any">
                </div>
                <div class="campo">
                    <label for="consumo1">Consumo</label>
                    <input type="number" id="consumo1" name="consumo1" step="any">
                </div>
            </article>

            <article class="coluna">
                <h3>Carro 2</h3>
                <div class="campo">
                    <label for="kmh2">KM/H</label>
                    <input type="number" name="kmh2" id="kmh2" step="any">
                </div>
                <div class="campo">
                    <label for="consumo2">Consumo</label>
                    <input type="number" id="consumo2" name="consumo2" step="any"> 
                </div>
            </article>

            <article class="form-gerais">
                <h3>Geral</h3>
                <div class="campo">
                    <label for="distancia">Distância</label>
                    <input type="number" id="distancia" name="distancia" step="any">
                </div>
                <div class="campo">
                    <label for="preco-energia">Preço Energia</label>
                    <input type="number" name="preco-energia" id="preco-energia" step="any">
                </div>
            </article>

            <button type="button" class="btn-enviar" onclick="salvarCalculo()">Enviar Formulário</button>
        </form>

        <div id="resultados-cards"></div>

    </main>
    <footer>
        <article class="footer-logo">
            <img src="src/assets/AUTOVELLE.png" alt="Logo AUTOVELLE">
            <span class="legenda-logo">Autovelle</span>
        </article>

        <article class="footer-social">
            <p class="footer-label">Contatos</p>
            <div class="social-icons">
                <a href="" class="social-icon" aria-label="LinkedIn"><img src="src/assets/linkedin.png" alt="Logo LinkedIn"></a>

                <a href="" class="social-icon" aria-label="Instagram"><img src="src/assets/insta.png" alt="Instagram"></a>

                <a href="" class="social-icon" aria-label="GitHub"><img src="src/assets/github.png" alt="GitHub"></a>
            </div>
        </article>

        <article class="footer-bottom">
            <p>&copy; 2026 - Todos os direitos reservados</p>
        </article>
    </footer>

    <script src="src/js/script.js"></script>
</body>
</html>
