<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css">
    <title>Concessionário AUTOVELLE</title>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <img src="src/assets/AUTOVELLE.png" alt="Logo AUTOVELLE">
            </div>
            <nav>
                <ul class="menu">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="index.html">Simulador</a></li>
                    <li><a href="#">Contatos</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <article>
            <img src="src/assets/porsche-logo.webp" alt="Logo Porsche" class="logo">
        </article>

        <hr>

        <section class="cards-container">
            
            <article class="card-carro">
                <article>
                    <p class="legenda">Classe G</p>
                    <img src="src/assets/Carro-porsche1.webp" alt="Mercedes-Benz Classe G" class="carro-imagem">
                </article>
                <article class="informacoes">
                    <img src="src/assets/porsche-logo.webp" alt="Logo Mercedes-Benz" class="logo">

                    <div class="preco">
                        <p>A partir de R$519.000</p>
                        <input type="button" value="Compre já" class="btn">
                    </div>
                </article>
            </article>

        </section>
    </main>
    <footer>
        <article class="footer-logo">
            <img src="src/assets/AUTOVELLE.png" alt="Logo AUTOVELLE">
            <span class="legenda-logo">Autovelle</span>
        </article>

        <article class="footer-social">
            <p class="footer-label">Contatos</p>
            <div class="social-icons">
                <a href="" class="social-icon" aria-label="LinkedIn"><img src="src/assets/linkedin.png" alt="Logo LinkedIn"></a>

                <a href="" class="social-icon" aria-label="Instagram"><img src="src/assets/insta.png" alt="Instagram"></a>

                <a href="" class="social-icon" aria-label="GitHub"><img src="src/assets/github.png" alt="GitHub"></a>
            </div>
        </article>

        <article class="footer-bottom">
            <p>&copy; 2026 - Todos os direitos reservados</p>
        </article>
    </footer>
</body>
</html>
